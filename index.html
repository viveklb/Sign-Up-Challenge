<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Signup Form</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 18px;
      margin-bottom: 10px;
      color: #111;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #222;
      border-radius: 5px;
      outline: none;
      background-color: #fff;
    }

    input:focus {
      border: 2px solid #111;
    }

    input.invalid {
      border-color: red;
    }

    input.valid {
      border-color: green;
    }

    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 8px;
      min-height: 18px;
    }

    #successMessage {
      color: green;
      font-size: 16px;
      margin-bottom: 20px;
      display: none;
    }

    button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 5px;
      background-color: #000;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background-color: #222;
    }

    button:focus {
      outline: 3px solid #aaa;
      outline-offset: 2px;
    }

    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding-top: 50px;
      }

      .container {
        max-width: 100%;
      }

      input,
      button {
        height: 48px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <form id="signupForm" novalidate>

      <!-- Email -->
      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Example@email.com"
          autocomplete="email"
          aria-describedby="emailError"
        />

        <p
          id="emailError"
          class="error-message"
          aria-live="polite"
        ></p>

      </div>


      <!-- Password -->
      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Your Password"
          autocomplete="new-password"
          aria-describedby="passwordError"
        />

        <p
          id="passwordError"
          class="error-message"
          aria-live="polite"
        ></p>

      </div>


      <!-- Success Message -->
      <p
        id="successMessage"
        aria-live="polite"
      >
        All good to go
      </p>


      <!-- Submit Button -->
      <button
        id="submit"
        type="submit"
      >
        Submit
      </button>

    </form>

  </main>


  <script>

    // ===============================
    // SELECT ELEMENTS
    // ===============================

    const form =
      document.getElementById("signupForm");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const emailError =
      document.getElementById("emailError");

    const passwordError =
      document.getElementById("passwordError");

    const successMessage =
      document.getElementById("successMessage");


    // ===============================
    // EMAIL VALIDATION
    // ===============================

    function validateEmail() {

      const value = email.value.trim();


      if (
        value.length <= 3 ||
        !value.includes("@") ||
        !value.includes(".")
      ) {

        emailError.textContent =
          "Make sure email is more than 3 characters and has @ and a .";

        email.classList.add("invalid");
        email.classList.remove("valid");

        return false;
      }


      emailError.textContent = "";

      email.classList.remove("invalid");
      email.classList.add("valid");

      return true;
    }


    // ===============================
    // PASSWORD VALIDATION
    // ===============================

    function validatePassword() {

      const value = password.value;


      if (value.length <= 8) {

        passwordError.textContent =
          "Make sure password is more than 8 characters.";

        password.classList.add("invalid");
        password.classList.remove("valid");

        return false;
      }


      passwordError.textContent = "";

      password.classList.remove("invalid");
      password.classList.add("valid");

      return true;
    }


    // ===============================
    // CHECK BOTH INPUTS
    // ===============================

    function checkFormValidity() {

      const emailValue =
        email.value.trim();

      const passwordValue =
        password.value;


      const emailValid =
        emailValue.length > 3 &&
        emailValue.includes("@") &&
        emailValue.includes(".");


      const passwordValid =
        passwordValue.length > 8;


      if (emailValid && passwordValid) {

        successMessage.style.display =
          "block";

      } else {

        successMessage.style.display =
          "none";
      }
    }


    // ===============================
    // EMAIL ONCHANGE
    // ===============================

    email.addEventListener(
      "input",
      function () {

        validateEmail();

        checkFormValidity();

      }
    );


    // ===============================
    // PASSWORD ONCHANGE
    // ===============================

    password.addEventListener(
      "input",
      function () {

        validatePassword();

        checkFormValidity();

      }
    );


    // ===============================
    // FORM SUBMISSION
    // ===============================

    form.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();


        const emailValid =
          validateEmail();

        const passwordValid =
          validatePassword();


        checkFormValidity();


        // Stop submission if invalid
        if (
          !emailValid ||
          !passwordValid
        ) {

          return;
        }


        // Confirmation Window
        const result =
          window.confirm(
            "Are you sure you want to signup?"
          );


        // User clicked OK
        if (result) {

          window.alert(
            "Successful signup!"
          );

        }

        // User clicked Cancel
        else {

          form.reset();

          emailError.textContent = "";

          passwordError.textContent = "";

          successMessage.style.display =
            "none";


          email.classList.remove(
            "valid",
            "invalid"
          );

          password.classList.remove(
            "valid",
            "invalid"
          );


          // Redirect to same page
          window.location.href =
            window.location.pathname;

        }

      }
    );

  </script>

</body>
</html>
